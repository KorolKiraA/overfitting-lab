[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overfitting-lab"
version = "0.2.0"
description = "Наглядная лаборатория переобучения: полиномиальная регрессия, кросс-валидация, кривые обучения, регуляризация"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
overfitting-lab = "overfitting_lab.cli:main"

[tool.setuptools]
packages = ["overfitting_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
